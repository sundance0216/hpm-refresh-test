name: HPM cloud refresh test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-test.yml'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: hpm-cloud-refresh-test
  cancel-in-progress: false

jobs:
  generate-html:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read workflow scheduler state
        id: scheduler_diagnostic
        if: github.event_name == 'push' && github.event.head_commit.message == 'Read workflow scheduler state'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GH_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/396782436"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2026-03-10"}
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              workflow = json.load(response)
          assert workflow["path"] == ".github/workflows/refresh-test.yml"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("state=" + workflow["state"] + "\n")
              stream.write("workflow_id=" + str(workflow["id"]) + "\n")
          print("Workflow state:", workflow["state"])
          PY

      - name: "GitHub workflow state: ${{ steps.scheduler_diagnostic.outputs.state }}; id=${{ steps.scheduler_diagnostic.outputs.workflow_id }}"
        if: steps.scheduler_diagnostic.outputs.state != ''
        run: echo 'Read-only workflow state check complete.'
      - name: Run Python and generate test HTML
        env:
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          from html import escape
          from pathlib import Path

          stamp = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          run = escape(os.environ['RUN_NUMBER'])
          event = escape(os.environ['EVENT_NAME'])
          report = f'''<!doctype html>
          <html lang="ja"><meta charset="utf-8"><title>Cloud refresh test</title>
          <body><h1>Python cloud refresh test</h1>
          <p>Test only. No company reports are connected.</p>
          <p>Generated at (Japan): {stamp}</p>
          <p>Run: {run}</p><p>Trigger: {event}</p></body></html>'''
          target = Path('output/refresh-test.html')
          target.parent.mkdir(exist_ok=True)
          target.write_text(report, encoding='utf-8')
          assert stamp in target.read_text(encoding='utf-8')
          print(f'PASS: Python generated HTML at {stamp}; trigger={event}; run={run}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'Python completed. Japan time: {stamp}. Run: {run}. Trigger: {event}.\n')
          PY

      - name: Save test HTML
        uses: actions/upload-artifact@v7
        with:
          name: refresh-test-${{ github.run_number }}
          path: output/refresh-test.html
          if-no-files-found: error
          retention-days: 2

# One-time execution probe requested by the repository owner; workflow behavior is unchanged.
